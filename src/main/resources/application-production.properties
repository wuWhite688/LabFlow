# Production / docker-compose middleware profile.
# Activate with: --spring.profiles.active=production
# Default profile remains H2 + local lock + local expiry for zero-dependency demos.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
# Override default profile (listeners disabled for H2 demo)
spring.rabbitmq.listener.simple.auto-startup=true
spring.rabbitmq.listener.direct.auto-startup=true

labops.reservation-lock.mode=redis
labops.reservation-lock.wait=2s
labops.reservation-lock.lease=10s
labops.reservation-expiry.mode=rabbit
# Keep a long DB compensation interval in production; Rabbit remains primary path.
labops.reservation-expiry.scan-interval=${LABOPS_EXPIRY_SCAN_INTERVAL:120000}

# Demo seed can be toggled from .env for local docker verification.
labops.demo-users.enabled=${LABOPS_DEMO_USERS:false}
labops.demo-data.enabled=${LABOPS_DEMO_DATA:false}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.redis.enabled=true
management.health.rabbit.enabled=true
management.health.db.enabled=true

logging.level.com.arthur.labops.reservation.lock.RedisReservationLock=INFO
logging.level.com.arthur.labops.reservation.expiry.RabbitReservationExpiryScheduler=INFO
logging.level.com.arthur.labops.reservation.expiry.RabbitReservationExpiryListener=INFO

# No default secret — production MUST provide JWT_SECRET via environment / .env (min 32 bytes, non-placeholder).
labops.jwt.secret=${JWT_SECRET}
labops.jwt.access-token-ttl=${JWT_ACCESS_TTL:15m}
labops.jwt.refresh-token-ttl=${JWT_REFRESH_TTL:7d}
labops.jwt.refresh-cookie-secure=${JWT_REFRESH_COOKIE_SECURE:true}
