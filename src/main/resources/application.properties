spring.application.name=lab-equipment-platform

# Default profile is local/dev only. Binding loopback means a forgotten
# `java -jar` cannot serve known demo users + repo JWT secret on a LAN NIC.
# Production script also sets 127.0.0.1; override explicitly to expose.
server.address=127.0.0.1

spring.data.web.pageable.max-page-size=100

spring.datasource.url=jdbc:h2:mem:labops;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.data.redis.repositories.enabled=false
labops.demo-users.enabled=true
labops.demo-data.enabled=true
labops.reservation-lock.mode=local
labops.reservation-lock.wait=2s
labops.reservation-lock.lease=10s
labops.reservation-approval-timeout=15m
labops.reservation-max-duration=12h
labops.reservation-max-active-per-user=20
labops.reservation-max-advance=30d
labops.login.max-failures-per-identity=5
labops.login.max-failures-per-ip=20
labops.login.window=15m
labops.payment.window=10m
labops.payment.callback-token=labflow-simulated-channel
labops.payment.channel.callback-mode=IMMEDIATE
labops.payment.channel.callback-delay=2s
labops.payment.channel.bill-directory=target/channel-bills
labops.payment.outbound.retry-interval=30s
labops.payment.reconciliation.enabled=true
labops.payment.reconciliation.cron=0 30 1 * * *
labops.reservation-expiry.mode=local
labops.reservation-expiry.scan-interval=30000

spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.redis.enabled=false
management.health.rabbit.enabled=false

# JWT (demo secret — override in production)
labops.jwt.secret=labflow-dev-only-change-me-32bytes-min!!
labops.jwt.access-token-ttl=15m
labops.jwt.refresh-token-ttl=7d
labops.jwt.refresh-cookie-secure=false
