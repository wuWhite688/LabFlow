spring.application.name=lab-equipment-platform

spring.datasource.url=jdbc:h2:mem:labops;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.data.redis.repositories.enabled=false
labops.demo-users.enabled=true
labops.demo-data.enabled=true
labops.reservation-lock.mode=local
labops.reservation-lock.wait=2s
labops.reservation-lock.lease=10s
labops.reservation-approval-timeout=15m
labops.reservation-max-duration=12h
labops.reservation-expiry.mode=local
labops.reservation-expiry.scan-interval=30000

spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.redis.enabled=false
management.health.rabbit.enabled=false

# JWT (demo secret — override in production)
labops.jwt.secret=labflow-dev-only-change-me-32bytes-min!!
labops.jwt.access-token-ttl=15m
labops.jwt.refresh-token-ttl=7d
labops.jwt.refresh-cookie-secure=false
