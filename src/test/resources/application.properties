server.address=127.0.0.1
labops.demo-users.enabled=true
labops.demo-data.enabled=false
labops.reservation-max-active-per-user=500
labops.login.max-failures-per-identity=50
labops.login.max-failures-per-ip=200
# Reconciliation is exercised explicitly by tests; the nightly job must not fire
# behind their backs and write bills for dates they are asserting on.
labops.payment.reconciliation.enabled=false
labops.payment.channel.callback-mode=IMMEDIATE
labops.payment.channel.bill-directory=target/test-channel-bills

# Every @SpringBootTest with distinct properties gets its own context, and all of
# them share one in-memory database. Scheduled scanners therefore run once per
# context against everyone else's rows: a background compensation scan can expire
# a reservation another test is mid-race on, and a background retry can dispatch
# another test's request to this context's channel. Tests that need these drive
# them explicitly or shorten the interval themselves.
labops.reservation-expiry.scan-interval=3600000
labops.payment.outbound.retry-interval=1h
