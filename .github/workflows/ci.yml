name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# 同一分支上新的推送会取消仍在排队的旧运行，避免浪费 runner 时间
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 · Java 21
    runs-on: ubuntu-latest

    # RabbitReservationExpiryOrderingIntegrationTest 用 assumeTrue 检测 127.0.0.1:5672，
    # 端口不通就整类跳过。没有这个 service 时它在 CI 里从未真正执行过，
    # 而 surefire 仍记为 skipped、CI 仍是绿灯 —— 即"假绿灯"。
    # 凭据必须与该测试 @DynamicPropertySource 的默认值一致。
    services:
      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          RABBITMQ_DEFAULT_USER: labops
          RABBITMQ_DEFAULT_PASS: labflow_rabbit_verify_only
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: 准备 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # 默认 profile 仍走 H2、进程内锁与本地定时器，不需要 MySQL / Redis。
      # 上面的 RabbitMQ service 只为让真实延迟队列顺序回归真正跑起来。
      - name: 构建与测试
        run: ./mvnw -B --no-transfer-progress verify

      # 只断言 tests>0 是不够的：被 assumeTrue 跳过时 surefire 同样记 tests="1"，
      # 只是同时记 skipped="1"。所以必须一并确认没有 skipped 元素，
      # 否则这道闸自己就会变成新的假绿灯。
      - name: 确认真实 RabbitMQ 顺序回归已执行
        shell: bash
        run: |
          set -euo pipefail
          report="target/surefire-reports/TEST-com.arthur.labops.reservation.expiry.RabbitReservationExpiryOrderingIntegrationTest.xml"
          test -f "$report"
          grep -Eq '<testsuite [^>]*tests="[1-9][0-9]*"' "$report"
          if grep -q '<skipped' "$report"; then
            echo "真实 RabbitMQ 顺序回归被跳过，broker 未就绪：" >&2
            grep -E '<testsuite |<skipped' "$report" >&2
            exit 1
          fi

      - name: 确认 MySQL refresh-token 并发回归已执行
        shell: bash
        run: |
          set -euo pipefail
          report="target/surefire-reports/TEST-com.arthur.labops.auth.RefreshTokenMysqlConcurrencyTest.xml"
          test -f "$report"
          grep -Eq '<testsuite [^>]*tests="[1-9][0-9]*"' "$report"
          if grep -q '<skipped' "$report"; then
            echo "MySQL refresh-token 并发回归被跳过，Docker/Testcontainers 未就绪：" >&2
            grep -E '<testsuite |<skipped' "$report" >&2
            exit 1
          fi

      - name: 确认 MySQL 支付回写并发回归已执行
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = Path("target/surefire-reports/TEST-com.arthur.labops.PaymentRequestMysqlConcurrencyTest.xml")
          if not report.is_file():
              raise SystemExit("缺少 MySQL 支付并发测试报告：测试未执行或编译失败")
          suite = ET.parse(report).getroot()
          cases = suite.findall("testcase")
          bad = [case.attrib.get("name") for case in cases
                 if any(case.find(tag) is not None for tag in ("skipped", "failure", "error"))]
          if len(cases) < 12 or bad or any(int(suite.get(tag, "0")) for tag in ("skipped", "failures", "errors")):
              raise SystemExit(f"MySQL 支付并发回归未完整通过：cases={len(cases)}, bad={bad}, totals={suite.attrib}")
          print(f"MySQL 支付回写并发回归已执行：{len(cases)} 项全部通过，无 skipped")
          PY

      # 失败时同样上传，否则排查 CI 红灯只能靠日志里被截断的堆栈
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  frontend:
    name: 前端 · Node 22
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # package.json 的 engines 要求 >=22.13.0
      - name: 准备 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 代码规范检查
        working-directory: frontend
        run: npm run lint

      # npm test 会先 vinext build 再跑单测，覆盖生产构建与 SSR 壳层。
      - name: 测试（含生产构建）
        working-directory: frontend
        run: npm test
